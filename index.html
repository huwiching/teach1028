<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>氣候俗諺動畫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--bg:#eef3f2;--fg:#1c2b2c;--mute:#566a6b;--card:#fff;--line:#cfdcdb;--acc:#2d6a67;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c1c;--fg:#e4eeed;--mute:#9bb2b1;--card:#1b2828;--line:#2e4242;--acc:#7fc4bd;--onacc:#0d1c1b}}
:root[data-theme="dark"]{--bg:#121c1c;--fg:#e4eeed;--mute:#9bb2b1;--card:#1b2828;--line:#2e4242;--acc:#7fc4bd;--onacc:#0d1c1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:28px 16px 40px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button,.ctl button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stage{border-radius:14px;overflow:hidden;background:#000}
.scene{display:none;width:100%;height:auto}
.scene.on{display:block}
.bar{height:3px;background:var(--line);margin-top:10px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;animation:prog 9s linear both}
.paused .bar i{animation-play-state:paused}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cap{margin-top:16px}
.cap h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:1.4rem;margin:0 0 6px}
.cap p{margin:0 0 6px;max-width:60ch}
.cap .n{color:var(--mute);font-size:.92rem}
.ctl{display:flex;gap:8px;margin-top:14px}

/* shared */
@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
.drop{animation:fall 1s linear infinite;stroke-linecap:round}
@keyframes fin{from{opacity:0}to{opacity:1}}
.late{animation:fin 1s 3s both}
@keyframes dash{to{stroke-dashoffset:-28}}
/* 1 spring rain */
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sp{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-out both}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.oil{transform-box:fill-box;transform-origin:center;animation:glow 1.6s ease-in-out infinite}
@keyframes cdrift{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
.cl{animation:cdrift 4s ease-out both}
/* 2 glow */
@keyframes sink{from{transform:translateY(-34px)}to{transform:translateY(24px)}}
.sink{animation:sink 7s ease-in-out both}
@keyframes dark{from{fill:#f3d9d0}to{fill:#59607a}}
.dk{animation:dark 4s 1s ease-in both}
/* 3 heat */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.heat{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-26px,45px) rotate(70deg)}50%{transform:translate(10px,95px) rotate(150deg)}75%{transform:translate(-20px,140px) rotate(240deg)}100%{transform:translate(0,172px) rotate(320deg)}}
.leaf{animation:leaf 7s ease-in-out both}
@keyframes mer{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.mer{transform-box:fill-box;transform-origin:50% 100%;animation:mer 6s ease-out both}
/* 4 dew */
@keyframes jk{0%,12%{opacity:0}22%,100%{opacity:1}}
@keyframes sk{0%,52%{opacity:0}62%,100%{opacity:1}}
@keyframes t1{0%,5%{opacity:0}12%,46%{opacity:1}52%,100%{opacity:0}}
@keyframes t2{0%,54%{opacity:0}60%,94%{opacity:1}99%,100%{opacity:0}}
.jk{animation:jk 9s infinite}.sk{animation:sk 9s infinite}.t1{animation:t1 9s infinite}.t2{animation:t2 9s infinite}
.wind{stroke-dasharray:10 12;animation:dash 1.2s linear infinite}
/* 5 swallow */
.bird{offset-path:path('M-30 168 C80 140 190 184 440 156');offset-rotate:0deg;animation:fly 6s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite alternate}
@keyframes rip{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.scene *{animation-play-state:paused!important}}
</style>
</head>
<body>
<main>
<h1>氣候俗諺動畫</h1>
<p class="sub">五句老祖宗的天氣智慧，看它們怎麼「動」起來。</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="stage" id="stage">

<!-- 1 春雨貴如油 -->
<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="春雨落下，嫩芽快速長高">
<rect width="400" height="240" fill="#c9d9de"/>
<g fill="#7d8c95"><ellipse cx="120" cy="38" rx="62" ry="22"/><ellipse cx="170" cy="30" rx="50" ry="22"/><ellipse cx="260" cy="40" rx="70" ry="22"/><ellipse cx="320" cy="34" rx="46" ry="19"/></g>
<g id="r1" stroke="#4f86a8" stroke-width="2"></g>
<rect y="185" width="400" height="55" fill="#6b8f4e"/><rect y="185" width="400" height="6" fill="#587a3f"/>
<g transform="translate(70,186)"><g class="sp" style="animation-delay:.2s"><path d="M0 0V-34" stroke="#3f7a35" stroke-width="3"/><ellipse cx="-8" cy="-34" rx="9" ry="4.5" fill="#4f9a45" transform="rotate(-30 -8 -34)"/><ellipse cx="8" cy="-38" rx="9" ry="4.5" fill="#4f9a45" transform="rotate(30 8 -38)"/></g></g>
<g transform="translate(150,186)"><g class="sp" style="animation-delay:.7s"><path d="M0 0V-46" stroke="#3f7a35" stroke-width="3"/><ellipse cx="-9" cy="-46" rx="10" ry="5" fill="#4f9a45" transform="rotate(-30 -9 -46)"/><ellipse cx="9" cy="-50" rx="10" ry="5" fill="#4f9a45" transform="rotate(30 9 -50)"/></g></g>
<g transform="translate(230,186)"><g class="sp" style="animation-delay:1.1s"><path d="M0 0V-40" stroke="#3f7a35" stroke-width="3"/><ellipse cx="-8" cy="-40" rx="9" ry="4.5" fill="#4f9a45" transform="rotate(-30 -8 -40)"/><ellipse cx="8" cy="-44" rx="9" ry="4.5" fill="#4f9a45" transform="rotate(30 8 -44)"/></g></g>
<g transform="translate(310,186)"><g class="sp" style="animation-delay:1.5s"><path d="M0 0V-52" stroke="#3f7a35" stroke-width="3"/><ellipse cx="-10" cy="-52" rx="11" ry="5" fill="#4f9a45" transform="rotate(-30 -10 -52)"/><ellipse cx="10" cy="-56" rx="11" ry="5" fill="#4f9a45" transform="rotate(30 10 -56)"/></g></g>
<circle class="oil" cx="110" cy="150" r="5" fill="#e6b422"/><circle class="oil" cx="270" cy="140" r="5" fill="#e6b422" style="animation-delay:.6s"/><circle class="oil" cx="355" cy="155" r="5" fill="#e6b422" style="animation-delay:1.1s"/>
<text x="16" y="224" fill="#fff" font-size="14">雨水滋潤，嫩芽冒出，金黃的光就是「油」</text>
</svg>

<!-- 2 朝霞晚霞 -->
<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="左邊朝霞後下雨，右邊晚霞後放晴">
<defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f09a9a"/><stop offset="1" stop-color="#f8d7a6"/></linearGradient><linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c3f7a"/><stop offset=".6" stop-color="#e8714a"/><stop offset="1" stop-color="#f7b36a"/></linearGradient></defs>
<rect width="200" height="240" fill="url(#gm)"/><rect x="200" width="200" height="240" fill="url(#ge)"/>
<circle cx="60" cy="165" r="26" fill="#ffd36b"/>
<g class="cl"><g class="dk" fill="#f3d9d0"><ellipse cx="90" cy="60" rx="52" ry="20"/><ellipse cx="140" cy="52" rx="40" ry="18"/><ellipse cx="60" cy="72" rx="36" ry="15"/></g></g>
<g class="late"><g id="r2" stroke="#3f5f80" stroke-width="2"></g></g>
<g class="sink"><circle cx="300" cy="150" r="30" fill="#ffe08a"/></g>
<path d="M0 190 Q60 175 120 190 T200 186 V240 H0Z" fill="#3b2f3a"/><path d="M200 188 Q270 170 330 188 T400 184 V240 H200Z" fill="#2b2233"/>
<line x1="200" y1="0" x2="200" y2="240" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
<text x="14" y="26" fill="#5a2f3a" font-size="16" font-weight="500">朝霞 → 轉雨</text><text x="214" y="26" fill="#fff" font-size="16" font-weight="500">晚霞 → 放晴</text>
</svg>

<!-- 3 秋老虎 -->
<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="立秋後太陽仍熾熱，溫度計上升，楓葉飄落">
<defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9e29a"/><stop offset="1" stop-color="#f2ac55"/></linearGradient></defs>
<rect width="400" height="240" fill="url(#gh)"/>
<g transform="translate(130,90)"><g class="rays" stroke="#ff9d2e" stroke-width="4" stroke-linecap="round"><path d="M0-52V-64M0 52V64M-52 0H-64M52 0H64M37-37L45-45M-37-37L-45-45M37 37L45 45M-37 37L-45 45"/></g><circle class="sun" r="36" fill="#ff7a21"/></g>
<g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"><path class="heat" d="M20 160q15-12 30 0t30 0 30 0 30 0 30 0 30 0"/><path class="heat" style="animation-delay:-.5s" d="M40 175q15-12 30 0t30 0 30 0 30 0 30 0"/></g>
<rect y="195" width="400" height="45" fill="#b0702b"/>
<g transform="translate(290,18)"><g class="leaf"><path d="M0 0C10-6 18 2 14 12C6 18-6 14-8 6 -6-2 -2-4 0 0Z" fill="#c4492a"/></g></g>
<rect x="337" y="46" width="14" height="118" rx="7" fill="#fff" fill-opacity=".85"/>
<rect class="mer" x="341" y="56" width="6" height="108" fill="#d8412f"/><circle cx="344" cy="172" r="13" fill="#d8412f"/>
<text x="16" y="226" fill="#fff" font-size="14">立秋已過，午後仍像老虎一樣熱</text>
</svg>

<!-- 4 白露寒露 -->
<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="白露穿外套，寒露穿襪子保暖的人物">
<defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd3e0"/><stop offset="1" stop-color="#e8f0f2"/></linearGradient></defs>
<rect width="400" height="240" fill="url(#gc)"/>
<g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path class="wind" d="M20 80q40-10 80 0"/><path class="wind" style="animation-delay:-.4s" d="M280 110q40-10 90 0"/><path class="wind" style="animation-delay:-.8s" d="M40 140q40-10 70 0"/></g>
<rect y="200" width="400" height="40" fill="#8aa0a8"/>
<line x1="194" y1="144" x2="194" y2="190" stroke="#3b3b3b" stroke-width="7" stroke-linecap="round"/><line x1="206" y1="144" x2="206" y2="190" stroke="#3b3b3b" stroke-width="7" stroke-linecap="round"/>
<g class="sk" fill="#e8b923"><rect x="190" y="170" width="8" height="20" rx="3"/><rect x="202" y="170" width="8" height="20" rx="3"/></g>
<ellipse cx="192" cy="194" rx="9" ry="4" fill="#222"/><ellipse cx="208" cy="194" rx="9" ry="4" fill="#222"/>
<rect x="188" y="86" width="24" height="58" rx="9" fill="#6b7f99"/>
<g stroke="#f2c9a0" stroke-width="5" stroke-linecap="round"><path d="M188 94L174 122M212 94L226 122"/></g>
<circle cx="200" cy="70" r="15" fill="#f2c9a0"/>
<g class="jk"><rect x="183" y="84" width="34" height="62" rx="11" fill="#c5483f"/><rect x="190" y="82" width="20" height="8" rx="4" fill="#f2d16b"/></g>
<text class="t1" x="200" y="226" text-anchor="middle" fill="#fff" font-size="15">白露：早晚轉涼，別露肩背</text>
<text class="t2" x="200" y="226" text-anchor="middle" fill="#fff" font-size="15">寒露：寒氣從腳底來，穿好襪子</text>
</svg>

<!-- 5 燕子低飛 -->
<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="燕子貼近地面低飛，烏雲聚集後下起大雨">
<defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b6bf"/><stop offset="1" stop-color="#6f7f8c"/></linearGradient></defs>
<rect width="400" height="240" fill="url(#gs)"/>
<g class="cl" fill="#46515c"><ellipse cx="100" cy="36" rx="70" ry="24"/><ellipse cx="190" cy="30" rx="60" ry="24"/><ellipse cx="290" cy="38" rx="74" ry="24"/></g>
<g class="late"><g id="r5" stroke="#d7e6f0" stroke-width="2"></g></g>
<rect y="196" width="400" height="44" fill="#4e6a7a"/>
<g fill="none" stroke="#cfe3ee" stroke-width="1.5"><ellipse class="rip" cx="90" cy="214" rx="26" ry="5"/><ellipse class="rip" style="animation-delay:.9s" cx="260" cy="222" rx="26" ry="5"/></g>
<g class="bird"><g class="wing"><path d="M-14 0Q-7-9 0 0Q7-9 14 0Q7-3 0 4Q-7-3-14 0Z" fill="#1d2430"/></g></g>
<text x="16" y="228" fill="#fff" font-size="14">氣壓低、空氣濕，昆蟲飛得低，燕子也跟著低飛</text>
</svg>
</div>
<div class="bar" id="bar"><i></i></div>
<div class="cap" aria-live="polite"><h2 id="ct"></h2><p id="cm"></p><p class="n" id="cn"></p></div>
<div class="ctl"><button id="prev">上一句</button><button id="pp">暫停</button><button id="next">下一句</button></div>
</main>
<script>
var D=[
["春雨貴如油","春天是播種與作物返青的時候，最需要水分，及時的雨水比油還珍貴。","動畫：雨滴落下，嫩芽一株株長高。"],
["朝霞不出門，晚霞行千里","天氣系統大多由西向東移動。早上東方出現朝霞，表示水氣多，雨雲可能趕來；傍晚西方出現晚霞，表示西邊空氣乾，天氣多半轉好。","動畫：左邊雲層聚集下雨，右邊夕陽落下、天空放晴。"],
["立秋不立秋，處暑仍是熱","節氣雖已入秋，但太平洋高壓仍強，午後依然悶熱，這種回頭的暑熱就叫「秋老虎」。","動畫：太陽依舊熾熱，溫度計上升，楓葉才剛飄落。"],
["白露身不露，寒露腳不露","白露（約 9 月 8 日）早晚溫差變大，要護住身體；寒露（約 10 月 8 日）寒氣更重，腳也要保暖。","動畫：先穿上外套，再穿上襪子。"],
["燕子低飛蛇過道，大雨不久就來到","下雨前氣壓下降、空氣潮濕，小昆蟲翅膀沾水飛不高，捕食的燕子也跟著貼地低飛。","動畫：燕子掠過低空，烏雲聚集後大雨落下。"]];
var S=[].slice.call(document.querySelectorAll(".scene")),T=document.getElementById("tabs"),
names=["春雨","朝霞晚霞","秋老虎","白露寒露","燕子低飛"],idx=0,play=true,tm;
function rain(id,n,a,b,y,col){var g=document.getElementById(id),s="";for(var i=0;i<n;i++){var x=a+(b-a)*i/n+Math.random()*8;s+='<line class="drop" x1="'+x+'" y1="'+y+'" x2="'+(x-3)+'" y2="'+(y+12)+'" style="animation-delay:-'+(Math.random()*1).toFixed(2)+'s"/>'}g.innerHTML=s}
rain("r1",26,10,390,44);rain("r2",11,12,188,70);rain("r5",26,10,390,60);
names.forEach(function(n,i){var b=document.createElement("button");b.textContent=n;b.setAttribute("role","tab");b.onclick=function(){go(i)};T.appendChild(b)});
function go(i){idx=(i+5)%5;
S.forEach(function(s,k){s.classList.toggle("on",k===idx)});
[].forEach.call(T.children,function(b,k){b.setAttribute("aria-selected",k===idx)});
ct.textContent="「"+D[idx][0]+"」";cm.textContent=D[idx][1];cn.textContent=D[idx][2];
var el=document.querySelector("#bar i");el.style.animation="none";void el.offsetWidth;el.style.animation="";
clearTimeout(tm);if(play)tm=setTimeout(function(){go(idx+1)},9000)}
prev.onclick=function(){go(idx-1)};next.onclick=function(){go(idx+1)};
pp.onclick=function(){play=!play;pp.textContent=play?"暫停":"播放";document.body.classList.toggle("paused",!play);clearTimeout(tm);if(play)go(idx)};
if(matchMedia("(prefers-reduced-motion:reduce)").matches){play=false;pp.textContent="播放";document.body.classList.add("paused")}
go(0);
</script>
</body>
</html>
